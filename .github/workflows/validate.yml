name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    name: OSS package and Windows samples # Existing required-check identity; desktop apps build in their own repositories.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build and inspect the OSS release assets
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/AbraxasDB/AbraxasDB.csproj -Raw
          ./scripts/Build-Release.ps1 -Version ([string]$project.Project.PropertyGroup.Version)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: abraxasdb-candidate
          path: artifacts/packages/*
          if-no-files-found: error
  portable-build:
    name: Linux core build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build AbraxasDB.sln -c Release -warnaserror
