name: Bug report
description: Report a reproducible OSS behavior problem
body:
  - type: input
    id: versions
    attributes:
      label: AbraxasDB version, .NET runtime and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data. Do not include credentials or private records.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
